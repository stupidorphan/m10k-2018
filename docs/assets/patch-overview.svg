<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Firmware changes used in the M10K 2018 report-rate experiments</title>
  <desc id="desc">A plain table summarizing three changes: endpoint 0x82 USB interrupt interval changed from 2 to 1 milliseconds; five conditional acquisition waits changed from 27, 20, 66, 120, 30 microseconds to 10, 10, 30, 60, 15 microseconds in the conservative profile or 7, 7, 20, 40, 10 in the balanced profile; three no-output debug paths and two redundant pressure retracks were skipped. Five resonance, seven Y, and seven X samples and the HID packet format remained unchanged. End-to-end latency was not measured.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>

  <text x="40" y="38" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Firmware changes</text>
  <text x="40" y="65" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="15">Small changes to USB scheduling, conditional waits, and repeated scan work</text>

  <text x="40" y="108" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1. USB endpoint schedule</text>
  <g stroke="#222222" stroke-width="1">
    <rect x="40" y="122" width="920" height="72" fill="#ffffff"/>
    <rect x="40" y="122" width="920" height="30" fill="#e9e9e9"/>
    <line x1="330" y1="122" x2="330" y2="194"/>
    <line x1="495" y1="122" x2="495" y2="194"/>
    <line x1="650" y1="122" x2="650" y2="194"/>
    <line x1="40" y1="152" x2="960" y2="152"/>
  </g>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="14">
    <text x="52" y="143" font-weight="700">Endpoint</text>
    <text x="342" y="143" font-weight="700">Setting</text>
    <text x="507" y="143" font-weight="700">Stock</text>
    <text x="662" y="143" font-weight="700">Patched</text>
    <text x="52" y="176">0x82 pen/vendor IN</text>
    <text x="342" y="176">bInterval</text>
    <text x="507" y="176">2 ms</text>
    <text x="662" y="176">1 ms</text>
    <text x="735" y="176">host scheduling interval</text>
  </g>

  <text x="40" y="238" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">2. Conditional acquisition waits</text>
  <g stroke="#222222" stroke-width="1">
    <rect x="40" y="252" width="920" height="226" fill="#ffffff"/>
    <rect x="40" y="252" width="920" height="34" fill="#e9e9e9"/>
    <line x1="390" y1="252" x2="390" y2="478"/>
    <line x1="580" y1="252" x2="580" y2="478"/>
    <line x1="765" y1="252" x2="765" y2="478"/>
    <line x1="40" y1="286" x2="960" y2="286"/>
    <line x1="40" y1="324" x2="960" y2="324"/>
    <line x1="40" y1="362" x2="960" y2="362"/>
    <line x1="40" y1="400" x2="960" y2="400"/>
    <line x1="40" y1="438" x2="960" y2="438"/>
  </g>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="14">
    <text x="52" y="274" font-weight="700">Wait site</text>
    <text x="402" y="274" font-weight="700">Stock (µs)</text>
    <text x="592" y="274" font-weight="700">Conservative (µs)</text>
    <text x="777" y="274" font-weight="700">Balanced (µs)</text>

    <text x="52" y="311">pre-acquisition</text>
    <text x="402" y="311">27</text>
    <text x="592" y="311">10</text>
    <text x="777" y="311">7</text>
    <text x="52" y="349">optional pressure</text>
    <text x="402" y="349">20</text>
    <text x="592" y="349">10</text>
    <text x="777" y="349">7</text>
    <text x="52" y="387">switch settle</text>
    <text x="402" y="387">66</text>
    <text x="592" y="387">30</text>
    <text x="777" y="387">20</text>
    <text x="52" y="425">wide recovery</text>
    <text x="402" y="425">120</text>
    <text x="592" y="425">60</text>
    <text x="777" y="425">40</text>
    <text x="52" y="463">normal recovery</text>
    <text x="402" y="463">30</text>
    <text x="592" y="463">15</text>
    <text x="777" y="463">10</text>
  </g>

  <text x="40" y="520" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">3. Repeated work skipped</text>
  <g fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <text x="40" y="548">Skipped: 3 no-output debug paths and 2 redundant pressure-band retracks.</text>
    <text x="40" y="574">Unchanged: 5 resonance samples, 7 Y samples, 7 X samples, and the HID report format.</text>
    <text x="40" y="610">These values describe internal work and report spacing; end-to-end pen-to-screen latency was not measured.</text>
  </g>
</svg>
