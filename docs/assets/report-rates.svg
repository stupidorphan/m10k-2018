<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Observed Gaomon M10K 2018 report rates</title>
  <desc id="desc">A simple horizontal range chart. The initial Gaomon firmware was reported at about 160 reports per second. The conservative patch ranged from 237 to 312 reports per second. The experimental balanced patch ranged from 312 to 350 reports per second and was later reverted. The highest observed result is about 2.2 times the initial baseline. These are report rates, not measured pen-to-screen latency.</desc>
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="40" y="38" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Observed report rate</text>
  <text x="40" y="65" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="15">OpenTabletDriver reports per second; one M10K 2018; approximate values</text>
  <text x="520" y="38" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="15">Highest / initial baseline: 350 / 160 ≈ 2.2×</text>

  <g stroke="#c7c7c7" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="105" x2="220" y2="390"/>
    <line x1="375" y1="105" x2="375" y2="390"/>
    <line x1="530" y1="105" x2="530" y2="390"/>
    <line x1="685" y1="105" x2="685" y2="390"/>
    <line x1="840" y1="105" x2="840" y2="390"/>
  </g>
  <g stroke="#111111" stroke-width="2">
    <line x1="220" y1="105" x2="220" y2="390"/>
    <line x1="220" y1="390" x2="840" y2="390"/>
  </g>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="220" y="410">0</text>
    <text x="375" y="410">100</text>
    <text x="530" y="410">200</text>
    <text x="685" y="410">300</text>
    <text x="840" y="410">400 Hz</text>
  </g>

  <g fill="#111111" font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="155" font-size="17" font-weight="700">Initial firmware</text>
    <text x="40" y="176" fill="#444444" font-size="13">reported baseline</text>
    <text x="40" y="255" font-size="17" font-weight="700">Conservative patch</text>
    <text x="40" y="276" fill="#444444" font-size="13">recovery profile</text>
    <text x="40" y="355" font-size="17" font-weight="700">Balanced patch</text>
    <text x="40" y="376" fill="#444444" font-size="13">experimental; reverted</text>
  </g>

  <g fill="none" stroke="#1f4e79" stroke-width="8">
    <line x1="220" y1="160" x2="468" y2="160"/>
    <line x1="587" y1="260" x2="704" y2="260"/>
    <line x1="704" y1="360" x2="763" y2="360"/>
  </g>
  <g stroke="#1f4e79" stroke-width="2">
    <line x1="220" y1="148" x2="220" y2="172"/>
    <line x1="468" y1="148" x2="468" y2="172"/>
    <line x1="587" y1="248" x2="587" y2="272"/>
    <line x1="704" y1="248" x2="704" y2="272"/>
    <line x1="704" y1="348" x2="704" y2="372"/>
    <line x1="763" y1="348" x2="763" y2="372"/>
  </g>
  <g fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <text x="485" y="166">≈160 Hz</text>
    <text x="720" y="266">237–312 Hz</text>
    <text x="780" y="366">312–350 Hz</text>
  </g>

  <line x1="40" y1="438" x2="860" y2="438" stroke="#777777" stroke-width="1"/>
  <g fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="40" y="462">The ≈160 Hz baseline came from the original firmware; stock 241030 was not separately benchmarked.</text>
    <text x="40" y="484">Balanced 350 Hz had phantom-input symptoms. Report spacing is not measured end-to-end input latency.</text>
  </g>
</svg>
