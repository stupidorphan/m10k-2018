<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Observed Gaomon M10K 2018 report rates</title>
  <desc id="desc">One tablet across separate runs. Initial Gaomon firmware was reported at about 160 reports per second. The conservative patch ranged from 237 to 312 reports per second. The experimental balanced patch ranged from 312 to 350 reports per second and was later reverted. The highest observed result is about 2.2 times the initial baseline. These are report rates, not measured pen-to-screen latency.</desc>
  <rect x="1" y="1" width="1038" height="568" rx="24" fill="#0b1423" stroke="#334155" stroke-width="2"/>
  <text x="42" y="67" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Observed report rate</text>
  <text x="42" y="101" fill="#b7c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="17">OpenTabletDriver reports per second • one M10K 2018 • approximate</text>
  <rect x="788" y="32" width="211" height="79" rx="17" fill="#173d4d" stroke="#38bdf8" stroke-width="2"/>
  <text x="807" y="72" fill="#e0f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">up to 2.2×</text>
  <text x="808" y="95" fill="#a9d9e9" font-family="Segoe UI,Arial,sans-serif" font-size="13">350 ÷ 160 ≈ 2.19</text>

  <g stroke="#334155" stroke-width="1">
    <line x1="270" y1="157" x2="270" y2="429"/>
    <line x1="430" y1="157" x2="430" y2="429"/>
    <line x1="590" y1="157" x2="590" y2="429"/>
    <line x1="750" y1="157" x2="750" y2="429"/>
    <line x1="910" y1="157" x2="910" y2="429"/>
  </g>
  <g fill="#9fb0c6" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">
    <text x="270" y="149">0</text>
    <text x="430" y="149">100</text>
    <text x="590" y="149">200</text>
    <text x="750" y="149">300</text>
    <text x="910" y="149">400 Hz</text>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="42" y="202" fill="#f1f5f9" font-size="19" font-weight="700">Initial firmware</text>
    <text x="42" y="225" fill="#9fb0c6" font-size="14">reported baseline</text>
    <rect x="270" y="190" width="256" height="43" rx="11" fill="#94a3b8"/>
    <text x="844" y="218" fill="#e2e8f0" font-size="19" font-weight="700">~160 Hz</text>

    <text x="42" y="293" fill="#f1f5f9" font-size="19" font-weight="700">Conservative patch</text>
    <text x="42" y="316" fill="#9fb0c6" font-size="14">recovery profile</text>
    <rect x="270" y="281" width="379" height="43" rx="11" fill="#0284c7"/>
    <rect x="638" y="281" width="131" height="43" rx="11" fill="#7dd3fc"/>
    <text x="842" y="309" fill="#e0f2fe" font-size="19" font-weight="700">237–312 Hz</text>

    <text x="42" y="384" fill="#f1f5f9" font-size="19" font-weight="700">Balanced patch</text>
    <text x="42" y="407" fill="#9fb0c6" font-size="14">experimental • reverted</text>
    <rect x="270" y="372" width="499" height="43" rx="11" fill="#7c3aed"/>
    <rect x="758" y="372" width="72" height="43" rx="11" fill="#c4b5fd"/>
    <text x="842" y="400" fill="#ede9fe" font-size="19" font-weight="700">312–350 Hz</text>
  </g>

  <rect x="42" y="459" width="18" height="18" rx="4" fill="#0284c7"/>
  <text x="70" y="473" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14">Lower rate seen in a profile</text>
  <rect x="316" y="459" width="18" height="18" rx="4" fill="#7dd3fc"/>
  <text x="344" y="473" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14">Additional observed range</text>
  <text x="42" y="517" fill="#b7c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="14">The ~160 Hz baseline came from the original firmware; stock 241030 was not separately benchmarked.</text>
  <text x="42" y="540" fill="#b7c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Balanced 350 Hz had phantom-input symptoms. Report spacing is not measured end-to-end input latency.</text>
</svg>
